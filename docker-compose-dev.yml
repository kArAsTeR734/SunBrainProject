services:
  frontend:
    build:
      context: ./SunBrainFrontend
      dockerfile: Dockerfile.dev
    image: sunbrain_frontend_dev
    container_name: sunbrain_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./SunBrainFrontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./SunBrainBackend
      dockerfile: Dockerfile.dev
    image: sunbrain_backend_dev
    container_name: sunbrain_backend_dev
    ports:
      - "5000:5000"
    env_file:
      - ./SunBrainBackend/.env
    volumes:
      - ./SunBrainBackend:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: sunbrain_db_dev
    environment:
      POSTGRES_DB: SunBrain_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SunBrain_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  db_restore:
    image: postgres:18-alpine
    profiles:
      - restore
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: SunBrain_dev
      PGUSER: postgres
      PGPASSWORD: root
      BACKUP_FILE: /backup/SunBrain_dev.backup
    volumes:
      - ./SunBrain_dev.backup:/backup/SunBrain_dev.backup:ro
      - ./scripts/restore-postgres-backup.sh:/scripts/restore-postgres-backup.sh:ro
    command: ["sh", "/scripts/restore-postgres-backup.sh"]

volumes:
  postgres18_data:
