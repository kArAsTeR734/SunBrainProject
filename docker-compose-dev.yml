services:
  frontend:
    build:
      context: ./SunBrainFrontend
      dockerfile: Dockerfile.dev
    image: sunbrain_frontend_dev
    ports:
      - "3000:3000"
    environment:
      - VITE_RUN=development
    depends_on:
      - backend

  backend:
    build:
      context: ./SunBrainBackend
      dockerfile: Dockerfile.dev
    image: sunbrain_backend_dev
    ports:
      - "5000:5000"
    env_file:
      - ./SunBrainBackend/.env
    volumes:
      - ./SunBrainBackend:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: SunBrain_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SunBrain_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres18_data:
    name: sunbrainproject_postgres18_data
    external: true
